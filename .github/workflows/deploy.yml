name: Deploy WuzAPI to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:  # deploy manual

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/wuzapi

            # Pull latest code
            git pull origin main

            # Generate .env from secrets
            cat > .env << 'ENVEOF'
            WUZAPI_PORT=8080
            WUZAPI_ADDRESS=0.0.0.0
            WUZAPI_ADMIN_TOKEN=${{ secrets.WUZAPI_ADMIN_TOKEN }}
            WUZAPI_GLOBAL_ENCRYPTION_KEY=${{ secrets.WUZAPI_GLOBAL_ENCRYPTION_KEY }}
            WUZAPI_GLOBAL_HMAC_KEY=${{ secrets.WUZAPI_GLOBAL_HMAC_KEY }}
            WUZAPI_GLOBAL_WEBHOOK=${{ secrets.WUZAPI_GLOBAL_WEBHOOK }}
            WEBHOOK_FORMAT=json
            SESSION_DEVICE_NAME=WuzAPI
            DB_USER=wuzapi
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=wuzapi
            DB_PORT=5432
            DB_SSLMODE=false
            TZ=America/Sao_Paulo
            RABBITMQ_PASSWORD=${{ secrets.DB_PASSWORD }}
            RABBITMQ_QUEUE=whatsapp_events
            ENVEOF

            # Ensure web-network exists
            docker network create web-network 2>/dev/null || true

            # Build and deploy
            docker compose -f docker-compose.prod.yml build --no-cache
            docker compose -f docker-compose.prod.yml up -d

            # Wait for health
            sleep 10
            curl -sf http://localhost:9090/ || echo "⚠️ Health check failed but container may still be starting"

            # Cleanup old images
            docker image prune -f
