name: Deploy WuzAPI to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Prepare ~/.ssh
        run: mkdir -p ~/.ssh

      - name: Generate .env file locally
        run: |
          cat <<'ENVEOF' > .env.prod
          WUZAPI_PORT=8080
          WUZAPI_ADDRESS=0.0.0.0
          WUZAPI_ADMIN_TOKEN=${{ secrets.WUZAPI_ADMIN_TOKEN }}
          WUZAPI_GLOBAL_ENCRYPTION_KEY=${{ secrets.WUZAPI_GLOBAL_ENCRYPTION_KEY }}
          WUZAPI_GLOBAL_HMAC_KEY=${{ secrets.WUZAPI_GLOBAL_HMAC_KEY }}
          WUZAPI_GLOBAL_WEBHOOK=${{ secrets.WUZAPI_GLOBAL_WEBHOOK }}
          WEBHOOK_FORMAT=json
          SESSION_DEVICE_NAME=WuzAPI
          DB_USER=wuzapi
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=wuzapi
          DB_PORT=5432
          DB_SSLMODE=false
          TZ=America/Sao_Paulo
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_QUEUE=whatsapp_events
          ENVEOF
          sed -i 's/^[[:space:]]*//' .env.prod

      - name: Upload .env to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new .env.prod $SSH_USER@$SSH_HOST:/home/deploy/wuzapi/.env

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST bash -s "$GH_TOKEN" << 'SSH_SCRIPT'
            set -e
            GH_TOKEN="$1"
            
            # Ensure /home/deploy/wuzapi exists
            mkdir -p /home/deploy/wuzapi
            cd /home/deploy/wuzapi

            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/Leobaiao/wuzapi-altdesk.git"

            # Pull latest code securely
            if [ ! -d ".git" ]; then
              git init
              git remote add origin "$REPO_URL"
              git fetch origin main
              git reset --hard FETCH_HEAD
            else
              git remote set-url origin "$REPO_URL"
              git fetch origin main
              git reset --hard FETCH_HEAD
            fi

            # Clean URL to prevent token leakage in logs
            git remote set-url origin https://github.com/Leobaiao/wuzapi-altdesk.git

            # Ensure web-network exists
            docker network create web-network 2>/dev/null || true

            # Build and deploy
            # -p fixa o projeto original (containers/volumes existentes)
            docker compose -p wuzapi-altdesk -f docker-compose.prod.yml build --no-cache
            docker compose -p wuzapi-altdesk -f docker-compose.prod.yml up -d

            # Wait for health
            echo "Aguardando inicialização da WuzAPI..."
            sleep 10
            curl -sf http://localhost:9090/ || echo "⚠️ Health check failed but container may still be starting"

            # Cleanup old images
            docker image prune -f
          SSH_SCRIPT
